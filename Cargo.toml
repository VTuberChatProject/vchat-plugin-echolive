[workspace]

[package]
name = "vchat-echolive-config-plugin"
version = "2.0.0"
edition = "2024"
description = "VChat Echo-Live 网页输出与配置插件"
license = "GPL-3.0-or-later"

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
external-resource-tests = []

[dependencies]
serde_json = "1.0"
json5 = "0.4"
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3.23"
tokio = { version = "1.47", features = ["full"] }
vchat-plugin-api = { git = "https://github.com/VTuberChatProject/VChatPluginNativeSDK.git", rev = "43145de48c412d605c2e157647a196c5f6c0478a" }
